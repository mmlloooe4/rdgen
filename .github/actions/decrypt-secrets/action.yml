name: 'Decrypt and Mask Secrets'
description: 'Decrypts a zip and masks the JSON contents as env vars'

inputs:
  zip_password:
    description: 'Password for the Zip'
    required: true
  zip_path:
    description: 'Path to the encrypted zip'
    required: false
    default: 'secrets.zip'

runs:
  using: "composite"
  steps:
    - name: Install Python dependencies
      shell: bash
      run: pip install pyzipper

    - name: Decrypt and Mask
      shell: python
      env:
        ZIP_PASSWORD: ${{ inputs.zip_password }}
        ZIP_PATH: ${{ inputs.zip_path }}
        PYTHONUTF8: "1"
      run: |
        import sys
        import pyzipper
        import json
        import os

        password = os.environ.get("ZIP_PASSWORD", "")
        zip_path = os.environ["ZIP_PATH"]

        if not password:
            raise RuntimeError("ZIP_PASSWORD is empty. Check GitHub Secrets.")

        with pyzipper.AESZipFile(zip_path, "r") as zf:
            zf.setpassword(password.encode("utf-8"))

            if "secrets.json" not in zf.namelist():
                raise RuntimeError("secrets.json not found inside ZIP.")

            with zf.open("secrets.json") as f:
                secrets = json.load(f)

        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
            for key, value in secrets.items():
                if value is not None and value != "":
                    value = str(value)
                    print(f"::add-mask::{value}")
                    env_file.write(f"{key}={value}\n")

        print(f"Successfully decrypted and masked {len(secrets)} secrets.")
